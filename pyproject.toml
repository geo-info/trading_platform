[project]
name = "trading-platform"
version = "0.1.0"
description = "Парсеры на collector-framework"
requires-python = ">=3.11"
dependencies = [
    "collector-framework>=0.0.1",
    "tinydb>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

# collector-framework пока не опубликован на PyPI, поэтому источник — git.
# Когда пакет появится в индексе, эта секция просто удаляется.
[tool.uv.sources]
collector-framework = { git = "https://github.com/barabacker/collector-framework", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
