[project]
name = "trading-platform"
version = "0.1.0"
description = "Парсеры на collector-framework"
requires-python = ">=3.11"
dependencies = [
    "collector-framework>=0.0.1",
    "pymongo>=4.9",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13",
    "tzdata>=2025.2",
]

# Запуск обхода: все площадки или площадки одного движка.
[project.scripts]
run_all = "run_all:main"
start_fogsoft = "tp.run_fogsoft:main"
start_kendo = "tp.run_kendo:main"
start_btorg = "tp.run_btorg:main"
start_ruson = "tp.run_ruson:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

# collector-framework пока не опубликован на PyPI, поэтому источник — git.
# Когда пакет появится в индексе, эта секция просто удаляется.
[tool.uv.sources]
collector-framework = { git = "https://github.com/barabacker/collector-framework", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/tp"]

# run_all — модуль, а не пакет, и в packages не попадает; без него скрипты
# запуска в собранном пакете не нашли бы, что вызывать.
[tool.hatch.build.targets.wheel.force-include]
"src/run_all.py" = "run_all.py"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "tp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
